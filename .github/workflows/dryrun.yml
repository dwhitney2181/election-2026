name: Dry run of the full update (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/scrape_federal.py
      - run: python3 tools/scrape_multistate.py
      - uses: actions/upload-artifact@v4
        with:
          name: dry
          path: |
            federal_live.json
            leg_live.json
