name: Update legislative results

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (times are UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legislative-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read MultiState results
        run: python3 tools/scrape_multistate.py
      - name: Build the atlas file
        run: python3 tools/build_atlas_feed.py --leg leg_live.json --out atlas-live.json --no-federal
      - name: Save if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leg_live.json atlas-live.json
          if git diff --cached --quiet; then echo "No new results"; exit 0; fi
          git commit -m "Legislative results update ($(date -u +'%b %d %H:%M UTC'))"
          git pull --rebase origin main
          git push origin HEAD:main
