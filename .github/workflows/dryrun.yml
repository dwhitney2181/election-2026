name: Dry run of the full update (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/scrape_federal.py
      - run: python3 tools/scrape_multistate.py
      - name: Push outputs to the dryrun branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out && cp federal_live.json leg_live.json /tmp/out/
          git checkout --orphan dryrun && git rm -rqf --cached . && cp /tmp/out/* . && git add federal_live.json leg_live.json
          git commit -qm "dry run output" && git push -f origin dryrun
