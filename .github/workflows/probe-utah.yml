name: Probe Utah results site (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/scrape_utah.py
      - name: Save output to the dryrun branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp utah_live.json /tmp/
          git checkout --orphan dryrun && git rm -rqf --cached . && cp /tmp/utah_live.json . && git add utah_live.json
          git commit -qm "utah dry run" && git push -f origin dryrun
